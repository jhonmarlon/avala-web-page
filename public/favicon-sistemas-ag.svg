<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Sistemas AG favicon</title>
  <desc id="desc">Esfera tecnológica azul, dorada y plateada con órbitas y estrellas.</desc>

  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0" stop-color="#0b2a55"/>
      <stop offset="0.55" stop-color="#06172f"/>
      <stop offset="1" stop-color="#020914"/>
    </radialGradient>

    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ee8ff"/>
      <stop offset="0.35" stop-color="#00a8ff"/>
      <stop offset="0.72" stop-color="#0755d9"/>
      <stop offset="1" stop-color="#031d64"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3a6"/>
      <stop offset="0.35" stop-color="#ffd05c"/>
      <stop offset="0.7" stop-color="#b56a12"/>
      <stop offset="1" stop-color="#5a2d04"/>
    </linearGradient>

    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#c6d3df"/>
      <stop offset="1" stop-color="#5d6d7f"/>
    </linearGradient>

    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#78d7b1"/>
      <stop offset="0.5" stop-color="#167d70"/>
      <stop offset="1" stop-color="#063d45"/>
    </linearGradient>

    <filter id="glowBlue" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="glowGold" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="sphereClip">
      <circle cx="256" cy="250" r="126"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <circle cx="256" cy="250" r="184" fill="none" stroke="#0b66ff" stroke-width="11" opacity="0.34" filter="url(#glowBlue)"/>
  <circle cx="256" cy="250" r="171" fill="none" stroke="#69ddff" stroke-width="3" opacity="0.8"/>

  <g clip-path="url(#sphereClip)">
    <rect x="118" y="112" width="276" height="276" fill="#061a34"/>

    <path d="M122 180 C185 105 327 106 390 173 C335 152 183 151 122 180Z" fill="url(#blue)"/>
    <path d="M108 217 C174 159 339 157 405 211 C338 199 179 201 108 217Z" fill="url(#green)"/>
    <path d="M104 252 C174 205 339 203 409 247 C333 244 179 246 104 252Z" fill="url(#silver)"/>
    <path d="M108 290 C177 246 337 245 404 286 C335 293 179 294 108 290Z" fill="url(#gold)"/>
    <path d="M120 329 C187 288 327 288 392 325 C324 341 189 341 120 329Z" fill="url(#silver)"/>
    <path d="M143 365 C198 333 311 333 367 360 C310 389 200 388 143 365Z" fill="url(#green)"/>

    <path d="M165 123 C206 171 211 324 174 376" fill="none" stroke="#b9ecff" stroke-width="4" opacity="0.8"/>
    <path d="M218 112 C247 170 252 332 230 382" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.74"/>
    <path d="M295 113 C273 170 269 333 288 382" fill="none" stroke="#8edfff" stroke-width="3" opacity="0.72"/>
    <path d="M348 129 C309 178 303 320 338 368" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.68"/>

    <ellipse cx="256" cy="211" rx="111" ry="47" fill="none" stroke="#dff8ff" stroke-width="3" opacity="0.6"/>
    <ellipse cx="256" cy="259" rx="122" ry="52" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.52"/>
    <ellipse cx="256" cy="307" rx="108" ry="43" fill="none" stroke="#87ddff" stroke-width="3" opacity="0.55"/>

    <ellipse cx="228" cy="183" rx="72" ry="42" fill="#8eeaff" opacity="0.13"/>
  </g>

  <circle cx="256" cy="250" r="126" fill="none" stroke="#86e6ff" stroke-width="5" opacity="0.72" filter="url(#glowBlue)"/>
  <circle cx="256" cy="250" r="126" fill="none" stroke="#e8f8ff" stroke-width="2" opacity="0.85"/>

  <path d="M80 327 C146 405 330 428 433 329" fill="none" stroke="url(#blue)" stroke-width="18" stroke-linecap="round" filter="url(#glowBlue)"/>
  <path d="M82 321 C165 383 338 402 430 324" fill="none" stroke="#7ee8ff" stroke-width="4" stroke-linecap="round" opacity="0.9"/>

  <path d="M91 191 C138 94 290 46 413 123" fill="none" stroke="#0a61dd" stroke-width="15" stroke-linecap="round" opacity="0.74" filter="url(#glowBlue)"/>
  <path d="M101 183 C157 98 298 62 405 129" fill="none" stroke="#8cecff" stroke-width="4" stroke-linecap="round" opacity="0.85"/>

  <g fill="#ffd45d" filter="url(#glowGold)">
