    <path d="M401 151 l3.5 9 9 3.5-9 3.5-3.5 9-3.5-9-9-3.5 9-3.5z"/>
    <path d="M419 180 l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
    <path d="M430 212 l2.8 7 7 2.8-7 2.8-2.8 7-2.8-7-7-2.8 7-2.8z"/>
    <path d="M434 245 l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z"/>
    <path d="M429 277 l2.3 5.5 5.5 2.3-5.5 2.3-2.3 5.5-2.3-5.5-5.5-2.3 5.5-2.3z"/>
  </g>
</svg>
