# IP real del visitante: el nginx del host (VPS) la manda en X-Real-IP
set_real_ip_from 127.0.0.1;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Real-IP;

# Anti-spam de formularios: máx. 6 solicitudes por minuto por IP a /api/
limit_req_zone $binary_remote_addr zone=forms:1m rate=6r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Formularios → contenedor api (server/). Resolución diferida: si api no existe
    # (p. ej. web-prod local) nginx arranca igual y /api/ responde 502.
    location /api/ {
        limit_req zone=forms burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;

        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Assets con hash: cache largo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Fallback SPA para React Router
    location / {
        # index.html siempre fresco: así cada deploy se ve sin recargar a la fuerza
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
