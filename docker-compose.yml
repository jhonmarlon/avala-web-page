services:
  # Entorno de desarrollo con hot-reload: docker compose up
  web:
    build:
      context: .
      target: dev
    container_name: avala-web-dev
    ports:
      - "${WEB_DEV_PORT:-5190}:5173"
    environment:
      # Los bind mounts de Windows no propagan eventos de archivos: forzar polling
      - VITE_USE_POLLING=true
    volumes:
      - .:/app
      # node_modules vive dentro del contenedor (no en el host / Dropbox)
      - node_modules:/app/node_modules

  # Build de producción servido con nginx: docker compose --profile prod up --build web-prod
  web-prod:
    build:
      context: .
      target: prod
    container_name: avala-web-prod
    ports:
      - "${WEB_PROD_PORT:-8095}:80"
    profiles:
      - prod

volumes:
  node_modules:
